name: Run LSTM pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python modules
        run: python -m compileall -q src

      - name: Execute notebook
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          PIPELINE_EPOCHS: "20"
        run: |
          mkdir -p artifacts
          python -m jupyter nbconvert \
            --execute \
            --to notebook \
            --ExecutePreprocessor.timeout=600 \
            --output topic_classification_pipeline.executed.ipynb \
            --output-dir artifacts \
            notebooks/topic_classification_pipeline.ipynb

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: artifacts/topic_classification_pipeline.executed.ipynb
