<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do classificador LSTM de tópicos</title>
  <desc id="desc">Fluxo dos dados rotulados até a previsão do tópico e sua execução pelo notebook e GitHub Actions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#2563eb;stroke-width:2;rx:14}
      .accent{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:14}
      .label{font:600 18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#475569;text-anchor:middle}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="330" fill="#ffffff"/>
  <text x="700" y="35" class="label" style="font-size:24px">Pipeline LSTM para classificação de tópicos</text>
  <rect x="30" y="95" width="180" height="90" class="box"/>
  <text x="120" y="130" class="label">CSV rotulado</text>
  <text x="120" y="158" class="small">texto + tópico</text>
  <path d="M210 140 H260" class="arrow"/>
  <rect x="270" y="95" width="190" height="90" class="box"/>
  <text x="365" y="130" class="label">Preparação</text>
  <text x="365" y="158" class="small">limpeza + split</text>
  <path d="M460 140 H510" class="arrow"/>
  <rect x="520" y="95" width="190" height="90" class="box"/>
  <text x="615" y="130" class="label">Vetorização</text>
  <text x="615" y="158" class="small">tokens + padding</text>
  <path d="M710 140 H760" class="arrow"/>
  <rect x="770" y="95" width="190" height="90" class="accent"/>
  <text x="865" y="126" class="label">Embedding</text>
  <text x="865" y="157" class="label">+ LSTM</text>
  <path d="M960 140 H1010" class="arrow"/>
  <rect x="1020" y="95" width="160" height="90" class="box"/>
  <text x="1100" y="130" class="label">Softmax</text>
  <text x="1100" y="158" class="small">4 classes</text>
  <path d="M1180 140 H1230" class="arrow"/>
  <rect x="1240" y="95" width="130" height="90" class="accent"/>
  <text x="1305" y="130" class="label">Tópico</text>
  <text x="1305" y="158" class="small">previsto</text>
  <rect x="420" y="235" width="240" height="60" class="box"/>
  <text x="540" y="271" class="label">Notebook executável</text>
  <rect x="740" y="235" width="240" height="60" class="box"/>
  <text x="860" y="261" class="label">GitHub Actions</text>
  <text x="860" y="283" class="small">validação automática</text>
  <path d="M660 265 H730" class="arrow"/>
</svg>
