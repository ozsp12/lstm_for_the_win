name: Generate hashed dependency lock

on:
  pull_request:
    paths:
      - "requirements-lock.in"
      - "pyproject.toml"
      - ".github/workflows/generate-lock.yml"

permissions:
  contents: write

concurrency:
  group: hashed-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate hash-locked requirements
        run: |
          python -m pip install pip-tools
          pip-compile --generate-hashes --allow-unsafe --resolver=backtracking --output-file requirements-lock.generated.txt requirements-lock.in

      - name: Version generated lock
        run: |
          mv requirements-lock.generated.txt requirements-lock.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-lock.txt
          if git diff --cached --quiet; then
            echo "requirements-lock.txt is already current."
          else
            git commit -m "build: refresh hash-locked dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-requirements-lock
          path: requirements-lock.txt
