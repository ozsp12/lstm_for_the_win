name: Version data and validate LSTM pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioned-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src streamlit_app.py

      - name: Timestamp the manual experiment
        run: echo "DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Append 100 train and 100 test reviews and execute both classifiers
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          PIPELINE_EPOCHS: "20"
        run: >-
          python -m lstm_for_the_win.handler run
          --append-data
          --data-timestamp "$DATA_TIMESTAMP"
          --run-id github-${{ github.run_id }}
          --epochs 20

      - name: Run automated tests
        env:
          PIPELINE_TEST_RUN_PATH: data/output/github-${{ github.run_id }}
        run: python -m pytest -q

      - name: Smoke-test the Streamlit server
        env:
          PIPELINE_OUTPUT_ROOT: data/output
        run: |
          python -m streamlit run streamlit_app.py --server.headless=true --server.port=8501 > data/output/streamlit.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat data/output/streamlit.log
          exit 1

      - name: Commit the versioned input batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input
          if git diff --cached --quiet; then
            echo "The agent did not append a versioned batch."
            exit 1
          fi
          git commit -m "data: append synthetic batch from run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:main

      - name: Upload versioned experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-demonstration-${{ github.run_id }}
          path: |
            data/output/github-${{ github.run_id }}
            data/output/streamlit.log
