name: Generate hashed dependency lock

on:
  pull_request:
    paths:
      - "requirements-lock.in"
      - "pyproject.toml"
      - ".github/workflows/generate-lock.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate hash-locked requirements
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --generate-hashes --resolver=backtracking --output-file requirements-lock.generated.txt requirements-lock.in
          python -m pip install --require-hashes -r requirements-lock.generated.txt
          python -m pip check

      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-requirements-lock
          path: requirements-lock.generated.txt
