name: Run continual-learning LSTM pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: versioned-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src tests

      - name: Timestamp experiment
        run: echo "DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Ensure initial input state exists
        run: |
          if [ ! -f data/input/train.csv ] || [ ! -f data/input/incoming.csv ]; then
            python -m lstm_for_the_win.handler generate-data \
              --mode initialize \
              --data-timestamp "$DATA_TIMESTAMP" \
              --overwrite
          fi

      - name: Train, evaluate incoming data, promote goldtest, and refresh incoming
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: >-
          python -m lstm_for_the_win.handler run
          --advance-data
          --data-timestamp "$DATA_TIMESTAMP"
          --run-id github-${{ github.run_id }}
          --epochs 20
          --patience 3

      - name: Prepare compact dashboard metrics
        run: |
          RUN_PATH="data/output/github-${{ github.run_id }}"
          python - "$RUN_PATH/results.json" "$RUN_PATH/metrics.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          fields = (
              "task", "train_size", "fit_size", "validation_size", "incoming_size",
              "labels", "metrics", "baseline_metrics", "metric_delta_vs_baseline",
          )
          compact = {
              task: {field: result[field] for field in fields}
              for task, result in source.items()
          }
          Path(sys.argv[2]).write_text(
              json.dumps(compact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run automated tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest -q

      - name: Commit next data generation and evaluation outputs
        run: |
          RUN_PATH="data/output/github-${{ github.run_id }}"
          test -f "$RUN_PATH/predictions.csv"
          test -f "$RUN_PATH/metrics.json"
          test -f "$RUN_PATH/run_manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input
          git add \
            data/output/latest.json \
            "$RUN_PATH/predictions.csv" \
            "$RUN_PATH/metrics.json" \
            "$RUN_PATH/run_manifest.json"
          if git diff --cached --quiet; then
            echo "The pipeline did not produce a versioned state transition."
            exit 1
          fi
          git commit -m "data: advance continual-learning generation ${{ github.run_id }} [skip ci]"
          git push origin HEAD:main

      - name: Upload complete experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lstm-experiment-${{ github.run_id }}
          path: data/output/github-${{ github.run_id }}
