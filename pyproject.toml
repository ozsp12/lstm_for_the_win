[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-for-the-win"
version = "0.11.0"
description = "Reproducible continual-learning LSTM experiment for product-review classification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow==2.20.0",
    "scikit-learn>=1.5,<2",
    "scipy==1.18.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "pytest-cov>=7.1,<8",
]

[project.scripts]
lstm-pipeline = "lstm_for_the_win.handler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=lstm_for_the_win --cov-report=term-missing --cov-fail-under=90"
