name: Run continual-learning LSTM pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - ".gitignore"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: versioned-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src tests

      - name: Timestamp experiment
        run: |
          DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          RUN_TIMESTAMP=$(date -u +'%Y%m%dT%H%M%SZ')
          RUN_ID="${RUN_TIMESTAMP}_github-${{ github.run_id }}"
          echo "DATA_TIMESTAMP=$DATA_TIMESTAMP" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Initialize corpus only when absent
        run: |
          if [ ! -f data/input/train.csv ] && [ ! -f data/input/incoming.csv ]; then
            python -m lstm_for_the_win.handler generate-data \
              --mode initialize \
              --data-timestamp "$DATA_TIMESTAMP"
          elif [ ! -f data/input/train.csv ] || [ ! -f data/input/incoming.csv ]; then
            echo "Input state is incomplete; refusing to overwrite an incremental corpus."
            exit 1
          fi

      - name: Validate corpus size and rich-language coverage
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          def read(path):
              with Path(path).open(encoding="utf-8", newline="") as f:
                  return list(csv.DictReader(f))

          train = read("data/input/train.csv")
          incoming = read("data/input/incoming.csv")
          assert len(train) >= 1000, f"train corpus too small: {len(train)}"
          assert len(incoming) >= 1000, f"incoming corpus too small: {len(incoming)}"
          for rows, name in ((train, "train"), (incoming, "incoming")):
              for field in ("hasemoji", "flagprofanity", "hasspellingerror", "hasslang"):
                  counts = Counter(row[field] for row in rows)
                  assert counts["1"] > 0, f"{name} has no positive {field} examples"
          print({"train": len(train), "incoming": len(incoming)})
          PY

      - name: Train, evaluate incoming data, promote goldtest, and refresh incoming
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: >-
          python -m lstm_for_the_win.handler run
          --advance-data
          --data-timestamp "$DATA_TIMESTAMP"
          --run-id "$RUN_ID"
          --epochs 20
          --patience 3

      - name: Verify canonical analysis artifacts
        run: |
          RUN_PATH="data/output/$RUN_ID"
          test -s "$RUN_PATH/analysis.json"
          test -s "$RUN_PATH/article_analysis.csv"
          python - "$RUN_PATH/analysis.json" "$RUN_PATH/article_analysis.csv" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          analysis = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert analysis["schema_version"] == "1.0.0"
          assert analysis["run"]["status"] == "complete"
          assert analysis["run"]["run_id"]
          assert analysis["reviews"]
          for task in ("sentiment", "topic"):
              result = analysis["tasks"][task]
              assert "metrics" in result
              assert "baseline_metrics" in result
              assert "metric_delta_vs_baseline" in result
              assert "segment_metrics" in result
              assert "uncertainty" in result
          with Path(sys.argv[2]).open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          groups = {row["analysis_group"] for row in rows}
          required = {
              "aggregate_metrics", "segment_metrics", "confusion_matrix", "classwise_metrics",
              "class_distribution", "confidence_accuracy", "calibration_bins", "error_summary",
              "training_history", "validation_incoming_gap", "uncertainty",
          }
          assert required.issubset(groups), required - groups
          PY

      - name: Run automated tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest -q

      - name: Commit incremental data state and analysis artifacts
        run: |
          RUN_PATH="data/output/$RUN_ID"
          test -f "$RUN_PATH/analysis.json"
          test -f "$RUN_PATH/article_analysis.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input data/output
          if git diff --cached --quiet; then
            echo "The pipeline did not produce an incremental state transition."
            exit 1
          fi
          git commit -m "data: publish $RUN_ID [skip ci]"
          git push origin HEAD:main

      - name: Upload lean analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lstm-analysis-${{ github.run_id }}
          path: |
            data/output/${{ env.RUN_ID }}/analysis.json
            data/output/${{ env.RUN_ID }}/article_analysis.csv
