name: Validate LSTM software

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src tests

      - name: Prepare current generator corpus
        run: |
          DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          CONFIG_VERSION=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("config/synthetic_data.json").read_text())["agent_version"])
          PY
          )
          MANIFEST_VERSION=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/input/input_manifest.json")
          if path.is_file():
              try:
                  print(json.loads(path.read_text()).get("agent_version", ""))
              except (json.JSONDecodeError, OSError):
                  print("")
          else:
              print("")
          PY
          )
          if [ ! -f data/input/train.csv ] || [ ! -f data/input/incoming.csv ] || [ "$CONFIG_VERSION" != "$MANIFEST_VERSION" ]; then
            python -m lstm_for_the_win.handler generate-data \
              --mode initialize \
              --data-timestamp "$DATA_TIMESTAMP" \
              --overwrite
          fi
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ("train.csv", "incoming.csv"):
              with (Path("data/input") / name).open(encoding="utf-8", newline="") as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 1000, f"{name} has only {len(rows)} rows"
          PY

      - name: Smoke-test both classifiers
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: >-
          python -m lstm_for_the_win.handler train
          --output-root artifacts/validation
          --run-id validation-${{ github.run_id }}
          --epochs 3
          --patience 1

      - name: Run automated tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest -q
