name: Version data and validate LSTM pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioned-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src

      - name: Timestamp the manual experiment
        run: echo "DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Append 100 train and 100 test reviews and execute both classifiers
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          PIPELINE_EPOCHS: "20"
        run: >-
          python -m lstm_for_the_win.handler run
          --append-data
          --data-timestamp "$DATA_TIMESTAMP"
          --run-id github-${{ github.run_id }}
          --epochs 20

      - name: Run automated tests
        run: python -m pytest -q

      - name: Commit versioned inputs and CSV outputs
        run: |
          RUN_PATH="data/output/github-${{ github.run_id }}"
          test -f "$RUN_PATH/predictions.csv"
          test -f "$RUN_PATH/evaluation_predictions.csv"
          test -f "$RUN_PATH/run_manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input
          git add \
            data/output/latest.json \
            "$RUN_PATH/predictions.csv" \
            "$RUN_PATH/evaluation_predictions.csv" \
            "$RUN_PATH/run_manifest.json"
          if git diff --cached --quiet; then
            echo "The agent did not append versioned inputs and outputs."
            exit 1
          fi
          git commit -m "data: append synthetic batch and results from run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:main

      - name: Upload versioned experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-demonstration-${{ github.run_id }}
          path: data/output/github-${{ github.run_id }}
