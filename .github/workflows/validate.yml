name: Validate LSTM software

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src tests

      - name: Prepare deterministic input state
        run: |
          if [ ! -f data/input/train.csv ] || [ ! -f data/input/incoming.csv ]; then
            echo "INITIALIZED_INPUT=1" >> "$GITHUB_ENV"
            DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            python -m lstm_for_the_win.handler generate-data \
              --mode initialize \
              --data-timestamp "$DATA_TIMESTAMP" \
              --overwrite
          fi

      - name: Smoke-test both classifiers
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: >-
          python -m lstm_for_the_win.handler train
          --output-root artifacts/validation
          --run-id validation-${{ github.run_id }}
          --epochs 3
          --patience 1

      - name: Run automated tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest -q

      - name: Persist initial corpus after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.INITIALIZED_INPUT == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/input
          git commit -m "data: initialize continual-learning corpus [skip ci]"
          git push origin HEAD:main
