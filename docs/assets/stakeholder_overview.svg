<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Stakeholder overview for product review intelligence</title>
  <desc id="desc">Sentiment and topic model performance, supported outputs, and business routing demonstration.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <rect x="30" y="25" width="1140" height="100" rx="18" fill="#1e3a8a"/>
  <text x="65" y="70" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#ffffff">Product Review Intelligence</text>
  <text x="65" y="99" font-family="Segoe UI,Arial" font-size="16" fill="#dbeafe">One review → sentiment + product topic → business routing</text>
  <rect x="30" y="145" width="270" height="130" rx="16" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="55" y="180" font-family="Segoe UI,Arial" font-size="14" fill="#64748b">CONTROLLED EXECUTION</text>
  <text x="55" y="235" font-family="Segoe UI,Arial" font-size="36" font-weight="700" fill="#1e3a8a">Handler</text>
  <rect x="320" y="145" width="270" height="130" rx="16" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="345" y="180" font-family="Segoe UI,Arial" font-size="14" fill="#64748b">STAKEHOLDER APPLICATION</text>
  <text x="345" y="235" font-family="Segoe UI,Arial" font-size="36" font-weight="700" fill="#1e3a8a">Streamlit</text>
  <rect x="610" y="145" width="270" height="130" rx="16" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="635" y="180" font-family="Segoe UI,Arial" font-size="14" fill="#64748b">SUPPORTED OUTPUTS</text>
  <text x="635" y="224" font-family="Segoe UI,Arial" font-size="34" font-weight="700" fill="#1e3a8a">7 classes</text>
  <rect x="900" y="145" width="270" height="130" rx="16" fill="#fef3c7" stroke="#d97706"/>
  <text x="925" y="180" font-family="Segoe UI,Arial" font-size="14" fill="#d97706">DEMONSTRATION DATA</text>
  <text x="925" y="220" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#172033">Synthetic &amp; balanced</text>
  <text x="925" y="248" font-family="Segoe UI,Arial" font-size="14" fill="#64748b">Not a production benchmark</text>
  <text x="30" y="325" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#172033">Stakeholder demonstration</text>
  <rect x="30" y="350" width="250" height="145" rx="16" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="55" y="385" font-family="Segoe UI,Arial" font-size="14" fill="#64748b">1 · INCOMING REVIEW</text>
  <text x="55" y="423" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#172033">“The phone battery is</text>
  <text x="55" y="448" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#172033">terrible and drains fast.”</text>
  <path d="M285 422 H330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="350" width="210" height="145" rx="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="365" y="385" font-family="Segoe UI,Arial" font-size="14" fill="#1e3a8a">2 · SENTIMENT</text>
  <text x="365" y="440" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#1e3a8a">Negative</text>
  <path d="M555 422 H600" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="610" y="350" width="210" height="145" rx="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="635" y="385" font-family="Segoe UI,Arial" font-size="14" fill="#1e3a8a">3 · TOPIC</text>
  <text x="635" y="440" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#1e3a8a">Smartphone</text>
  <path d="M825 422 H870" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="880" y="350" width="290" height="145" rx="16" fill="#dcfce7" stroke="#166534"/>
  <text x="905" y="385" font-family="Segoe UI,Arial" font-size="14" fill="#166534">4 · SUGGESTED ACTION</text>
  <text x="905" y="425" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172033">Prioritize and route to the</text>
  <text x="905" y="452" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172033">Smartphone support team</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
