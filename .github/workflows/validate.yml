name: Validate LSTM software

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src tests

      - name: Prepare corpus if absent
        run: |
          DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          if [ ! -f data/input/train.csv ] && [ ! -f data/input/incoming.csv ]; then
            python -m lstm_for_the_win.handler generate-data \
              --mode initialize \
              --data-timestamp "$DATA_TIMESTAMP"
          elif [ ! -f data/input/train.csv ] || [ ! -f data/input/incoming.csv ]; then
            echo "Input state is incomplete; refusing to overwrite an incremental corpus."
            exit 1
          fi
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ("train.csv", "incoming.csv"):
              with (Path("data/input") / name).open(encoding="utf-8", newline="") as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 1000, f"{name} has only {len(rows)} rows"
          PY

      - name: Smoke-test both classifiers and canonical analysis export
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: >-
          python -m lstm_for_the_win.handler train
          --output-root artifacts/validation
          --run-id validation-${{ github.run_id }}
          --epochs 3
          --patience 1

      - name: Validate lean run contract
        run: |
          RUN_PATH="artifacts/validation/validation-${{ github.run_id }}"
          test -s "$RUN_PATH/analysis.json"
          test -s "$RUN_PATH/article_analysis.csv"
          test ! -e "$RUN_PATH/predictions.csv"
          test ! -e "$RUN_PATH/metrics.json"
          test ! -e "$RUN_PATH/results.json"
          test ! -e "$RUN_PATH/run_manifest.json"
          test ! -e "$RUN_PATH/figures"
          python - "$RUN_PATH/analysis.json" "$RUN_PATH/article_analysis.csv" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path
          analysis = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert analysis["schema_version"] == "1.0.0"
          assert set(analysis["tasks"]) == {"sentiment", "topic"}
          assert analysis["reviews"]
          with Path(sys.argv[2]).open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          groups = {row["analysis_group"] for row in rows}
          assert "confusion_matrix" in groups
          assert "classwise_metrics" in groups
          assert "calibration_bins" in groups
          assert "training_history" in groups
          assert "uncertainty" in groups
          PY

      - name: Run automated tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest -q
