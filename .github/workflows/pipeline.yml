name: Validate LSTM software pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Validate Python modules
        run: python -m compileall -q src streamlit_app.py

      - name: Generate data and execute both classifiers
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          PIPELINE_EPOCHS: "20"
        run: >-
          python -m lstm_for_the_win.handler run
          --run-id github-${{ github.run_id }}
          --epochs 20

      - name: Verify reproducible synthetic input
        run: git diff --exit-code -- data/input

      - name: Run automated tests
        env:
          PIPELINE_TEST_RUN_PATH: data/output/github-${{ github.run_id }}
        run: python -m pytest -q

      - name: Smoke-test the Streamlit server
        env:
          PIPELINE_OUTPUT_ROOT: data/output
        run: |
          python -m streamlit run streamlit_app.py --server.headless=true --server.port=8501 > data/output/streamlit.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID" EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat data/output/streamlit.log
          exit 1

      - name: Upload software demonstration
        uses: actions/upload-artifact@v4
        with:
          name: software-demonstration
          path: |
            data/output/github-${{ github.run_id }}
            data/output/streamlit.log
