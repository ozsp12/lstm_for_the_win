name: Run frozen-state LSTM experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "data/input/**"
      - "pyproject.toml"
      - "requirements-lock.in"
      - "requirements-lock.txt"
      - "CITATION.cff"
      - "LICENSE"
      - "DATA_LICENSES.md"
      - "scripts/check_version_sync.py"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/advance-data.yml"

permissions:
  contents: write

concurrency:
  group: versioned-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "42"
      TF_DETERMINISTIC_OPS: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Validate software metadata
        run: |
          python -m compileall -q src tests scripts
          python scripts/check_version_sync.py

      - name: Timestamp experiment
        run: |
          DATA_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          RUN_TIMESTAMP=$(date -u +'%Y%m%dT%H%M%SZ')
          RUN_ID="${RUN_TIMESTAMP}_github-${{ github.run_id }}"
          echo "DATA_TIMESTAMP=$DATA_TIMESTAMP" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Prepare frozen corpus and optional one-time reset
        run: |
          if [ -f config/reset_experiment.once ]; then
            echo "RESET_EXPERIMENT=1" >> "$GITHUB_ENV"
            rm -f data/input/train.csv \
                  data/input/incoming.csv \
                  data/input/input_manifest.json \
                  data/input/benchmark.csv \
                  data/input/benchmark_manifest.json \
                  data/output/latest.json
            python -m lstm_for_the_win.handler generate-data \
              --mode initialize \
              --data-timestamp "$DATA_TIMESTAMP"
          else
            echo "RESET_EXPERIMENT=0" >> "$GITHUB_ENV"
            if [ ! -f data/input/train.csv ] && [ ! -f data/input/incoming.csv ]; then
              python -m lstm_for_the_win.handler generate-data \
                --mode initialize \
                --data-timestamp "$DATA_TIMESTAMP"
            elif [ ! -f data/input/train.csv ] || [ ! -f data/input/incoming.csv ]; then
              echo "Input state is incomplete; refusing to mutate it."
              exit 1
            fi
          fi
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("data/input")
          manifest = json.loads((root / "input_manifest.json").read_text(encoding="utf-8"))
          for name in ("train.csv", "incoming.csv"):
              with (root / name).open(encoding="utf-8", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              assert len(rows) >= 1000
              assert all(row.get("template_family") for row in rows)
          if Path("config/reset_experiment.once").is_file():
              assert manifest["generation"] == 0
              assert manifest["promoted_from_previous_incoming"] == 0
              assert manifest["record_counts"]["train.csv"] == manifest["config"]["initial_train_rows"]
              assert manifest["template_family_metadata"]["origin"] == "generated_at_render_time"
          PY

      - name: Capture frozen input state
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("data/input")
          manifest = json.loads((root / "input_manifest.json").read_text(encoding="utf-8"))
          state = {
              "generation": manifest["generation"],
              "train_sha256": hashlib.sha256((root / "train.csv").read_bytes()).hexdigest(),
              "incoming_sha256": hashlib.sha256((root / "incoming.csv").read_bytes()).hexdigest(),
              "manifest_sha256": hashlib.sha256((root / "input_manifest.json").read_bytes()).hexdigest(),
          }
          Path("/tmp/frozen_state.json").write_text(json.dumps(state), encoding="utf-8")
          print(state)
          PY

      - name: Train and evaluate frozen state
        run: >-
          python -m lstm_for_the_win.handler run
          --data-timestamp "$DATA_TIMESTAMP"
          --run-id "$RUN_ID"
          --epochs 20
          --patience 3
          --seed 42
          --split-seed 42
          --replicate-seeds "42,1337,2026"

      - name: Verify frozen-state and run contract
        run: |
          RUN_PATH="data/output/$RUN_ID"
          test -s "$RUN_PATH/run.json"
          test -s "$RUN_PATH/article_analysis.csv"
          test -d "$RUN_PATH/figures"
          test "$(find "$RUN_PATH/figures" -maxdepth 1 -type f -name '*.svg' | wc -l)" -ge 4
          python - "$RUN_PATH/run.json" "$RESET_EXPERIMENT" <<'PY'
          import csv, hashlib, json, sys
          from pathlib import Path
          run_path = Path(sys.argv[1])
          reset = sys.argv[2] == "1"
          run = json.loads(run_path.read_text(encoding="utf-8"))
          frozen = json.loads(Path("/tmp/frozen_state.json").read_text(encoding="utf-8"))
          root = Path("data/input")
          assert hashlib.sha256((root / "train.csv").read_bytes()).hexdigest() == frozen["train_sha256"]
          assert hashlib.sha256((root / "incoming.csv").read_bytes()).hexdigest() == frozen["incoming_sha256"]
          assert hashlib.sha256((root / "input_manifest.json").read_bytes()).hexdigest() == frozen["manifest_sha256"]
          assert run["run"]["input_generation"] == frozen["generation"]
          assert run["run"]["determinism"]["tensorflow_op_determinism"] is True
          if reset:
              assert frozen["generation"] == 0
              assert run["run"]["parent_run_id"] is None
          for task_name in ("sentiment", "topic"):
              task = run["tasks"][task_name]
              assert task["canonical_estimate"]["method"] == "mean_across_model_seeds"
              assert task["replicates"]["count"] == 3
              assert len(task["calibration_bins"]) == 10
              assert sum(item["support"] for item in task["calibration_bins"]) == task["incoming_size"]
              assert task["confusion_matrix_contract"]["axis_convention"] == "rows_expected_columns_predicted"
              assert all(
                  "accuracy_ci95" in segment and "support" in segment
                  for segments in task["segment_metrics"].values()
                  for segment in segments.values()
              )
          external = run["external_validation"]
          assert "binary_restricted_accuracy" in external
          assert external["confusion_matrix"]["axis_convention"] == "rows_expected_columns_predicted"
          assert external["reviews"] and all(len(row["probabilities"]) == 3 for row in external["reviews"])
          with (run_path.parent / "article_analysis.csv").open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == len(run["reviews"])
          assert rows and "analysis_group" not in rows[0]
          assert {"review_id", "text", "sentiment_lstm_accuracy", "topic_lstm_accuracy", "external_binary_restricted_accuracy"}.issubset(rows[0])
          PY

      - name: Verify deterministic derived artifacts
        run: |
          RUN_PATH="data/output/$RUN_ID"
          python - "$RUN_PATH" <<'PY'
          import hashlib, shutil, sys
          from pathlib import Path
          from lstm_for_the_win.derived_artifacts import materialize_derived_artifacts
          root = Path(sys.argv[1])
          def hashes():
              paths = [root / "article_analysis.csv", *sorted((root / "figures").glob("*"))]
              return {path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest() for path in paths if path.is_file()}
          before = hashes()
          (root / "article_analysis.csv").unlink()
          shutil.rmtree(root / "figures")
          materialize_derived_artifacts(root / "run.json")
          assert before == hashes()
          PY

      - name: Run automated tests with coverage gate
        run: python -m pytest -q

      - name: Retain only the validated latest run
        run: |
          python - "$RUN_ID" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          root = Path("data/output")
          keep = sys.argv[1]
          for child in root.iterdir():
              if child.is_dir() and child.name != keep:
                  shutil.rmtree(child)
          (root / ".gitkeep").unlink(missing_ok=True)
          (root / "latest.json").write_text(json.dumps({"run_id": keep}, indent=2) + "\n", encoding="utf-8")
          assert [path.name for path in root.iterdir() if path.is_dir()] == [keep]
          PY

      - name: Commit validated run and reset state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RESET_EXPERIMENT" = "1" ]; then
            rm -f config/reset_experiment.once
          fi
          git add data/input data/external data/output
          git add -u config/reset_experiment.once 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No repository state changed; run remains available only as Actions output."
            exit 0
          fi
          git commit -m "data: publish $RUN_ID [skip ci]"
          git push origin HEAD:main

      - name: Upload validated run bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lstm-run-${{ github.run_id }}
          path: data/output/${{ env.RUN_ID }}
